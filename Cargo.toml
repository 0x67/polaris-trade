[workspace]
resolver = "3"
# literal list, no globs; each crate lands together with its manifest
members = ["crates/transports/core"]

[workspace.package]
edition = "2024"
rust-version = "1.96.1"
authors = ["0x67 <69191110+0x67@users.noreply.github.com>"]
repository = "https://github.com/0x67/polaris-trade"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
transport_core = { path = "crates/transports/core" }

# publish = false upstream: any crate enabling this cannot be published to crates.io until it is
observability-core = { git = "https://github.com/0x67/observability", tag = "observability-core-v0.2.1" }
metrics = "0.24"
thiserror = "2.0.18"

# dev only
criterion = "0.8.2"
metrics-util = { version = "0.20", default-features = false, features = ["debugging"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# `#[must_use]` on every pure fn is noise; add it where dropping result is bug
must_use_candidate = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# whole workspace inherits: profiles only apply at root
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
