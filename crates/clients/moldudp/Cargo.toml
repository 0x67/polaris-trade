[package]
name = "client_moldudp"
version = "0.1.0"
description = "MoldUDP64 client: wire codec, sequence reassembler, gap request handler, A/B arbiter, receiver"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
# optional git dep on observability-core blocks crates.io until it is published
publish = false

[dependencies]
transport_core = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
humantime-serde = { workspace = true }
thiserror = { workspace = true }
smallvec = { workspace = true }
bitvec = { workspace = true }
tracing = { workspace = true }
observability-core = { workspace = true, optional = true }
metrics = { workspace = true, optional = true }

[features]
default = []
observability = ["dep:observability-core", "dep:metrics", "transport_core/observability"]

[dev-dependencies]
transport_core = { workspace = true, features = ["testing"] }
transport_socket = { workspace = true, features = ["tokio", "mio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "time"] }
allocation-counter = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
