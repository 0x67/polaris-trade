[package]
name = "polaris-format-pbn"
description = "Polaris Binary eNcoding: self-describing wire/file format for normalized market-data records"
version = "0.3.0" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
# lib target keeps its original name: the package rename is a registry
# concern, and dependents alias it back anyway. Own tests and examples
# link by lib name, so changing it would rewrite every import here.
name = "pbn"

[dependencies]
md-events = { workspace = true }
thiserror = { workspace = true }
zstd = { workspace = true }
