# Generates include/polaris_abi.h from src/lib.rs, the embedding API, and
# ../plugin/src/abi.rs, the plugin ABI. tests/header.rs runs this config and
# fails when the committed header differs from its output.
language = "C"
# The include guard is written by hand in `header` and `trailer`, because
# cbindgen puts the trailer after its own guard and the record header size
# check must stay inside one: C99 refuses a typedef defined twice.
header = """
#ifndef POLARIS_ABI_H
#define POLARIS_ABI_H"""
autogen_warning = "/* Generated by cbindgen from src/lib.rs and ../plugin/src/abi.rs with cbindgen.toml. Do not edit by hand: tests/header.rs regenerates it. */"
cpp_compat = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]
trailer = """
/*
 polaris_record_header must be the 56 bytes md-events lays out, which
 polaris-plugin also asserts in Rust. C99 has no _Static_assert, so a
 mismatch gives this array a negative size, an error on every compiler.
 */
typedef char polaris_record_header_is_56_bytes[(sizeof(polaris_record_header) == 56) ? 1 : -1];

#endif  /* POLARIS_ABI_H */"""

[export]
# No embedding function reaches the plugin ABI's types, so they are listed;
# the vtable pulls in every struct its entries take.
include = ["PolarisAdapterEntry", "PolarisAdapterVtable", "PolarisRecordHeader"]

[export.rename]
"PolarisFeed" = "polaris_feed"
"PolarisRecord" = "polaris_record"
"PolarisRecordHeader" = "polaris_record_header"
"PolarisAdapter" = "polaris_adapter"
"PolarisAdapterEntry" = "polaris_adapter_entry_fn"
"PolarisAdapterStats" = "polaris_adapter_stats"
"PolarisAdapterVtable" = "polaris_adapter_vtable"
"PolarisSessionModel" = "polaris_session_model"
"PolarisVenue" = "polaris_venue"
