# Generates include/polaris_abi.h from src/lib.rs. tests/header.rs runs this
# config and fails when the committed header differs from its output.
language = "C"
include_guard = "POLARIS_ABI_H"
autogen_warning = "/* Generated by cbindgen from src/lib.rs with cbindgen.toml. Do not edit by hand: tests/header.rs regenerates it. */"
cpp_compat = true
usize_is_size_t = true
style = "type"
documentation_style = "c"
no_includes = true
sys_includes = ["stddef.h", "stdint.h"]

[export.rename]
"PolarisFeed" = "polaris_feed"
"PolarisRecord" = "polaris_record"
