[package]
name = "polaris-venue-sgx"
description = "SGX venue crate: generated wire-parse code for SGX feed protocols"
version = "0.2.0" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
# lib target keeps its original name: the package rename is a registry
# concern, and dependents alias it back anyway. Own tests and benches
# link by lib name, so changing it would rewrite every import here.
name = "proto_sgx"

[dependencies]
proto-common = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "per_kind_itch_v2"
harness = false
