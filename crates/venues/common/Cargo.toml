[package]
name = "polaris-venue-common"
description = "Shared hand-written error types and alpha-field helpers for generated venue crates"
version = "0.3.0" # x-release-please-version
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish = false

[lib]
# lib target keeps its original name: the package rename is a registry
# concern, and dependents alias it back anyway. Own tests and benches
# link by lib name, so changing it would rewrite every import here.
name = "proto_common"

[dependencies]
thiserror = { workspace = true }
