name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # whole workspace, default features. public repo: full 3-OS matrix on
  # GitHub-hosted runners.
  rust:
    uses: 0x67/ci/.github/workflows/rust-ci.yml@main

  # same workspace with every host-buildable feature on. list matches
  # lefthook.yml verbatim; driver-dpdk stays out, macOS/Windows have no libdpdk.
  rust-features:
    uses: 0x67/ci/.github/workflows/rust-ci.yml@main
    with:
      concurrency-key: features
      workspace-args: --features transport-core/testing,transport-core/observability,transport-socket/tokio,transport-socket/mio,transport-socket/observability,transport-io-uring/observability,transport-afxdp/observability,transport-dpdk/observability,client-moldudp/observability,client-soupbintcp/tokio,client-soupbintcp/compressed,client-soupbintcp/observability

  # DPDK driver leg: needs libdpdk, Linux only. Checked apart from the
  # workspace jobs above so a missing system lib never blocks the portable path.
  dpdk:
    uses: 0x67/ci/.github/workflows/rust-features.yml@main
    with:
      extra-commands: |
        sudo apt-get update && sudo apt-get install -y libdpdk-dev libpcap-dev pkg-config
        cargo clippy -p transport-dpdk --all-targets --locked --features driver-dpdk -- -D warnings
        cargo test -p transport-dpdk --locked --features driver-dpdk --no-run

  # pool and ring arithmetic under Miri. one job per slice: a shared miri-args
  # string would apply one crate's test filter to the other's tests too.
  miri-pool:
    uses: 0x67/ci/.github/workflows/rust-miri.yml@main
    with:
      miri-args: -p transport-core --test miri_pool
      advisory: true

  miri-bypass:
    uses: 0x67/ci/.github/workflows/rust-miri.yml@main
    with:
      miri-args: -p transport-core --features testing --test bypass
      advisory: true

  # runner is already the Linux target Miri interprets here, so no --target flag.
  miri-afxdp-ring:
    uses: 0x67/ci/.github/workflows/rust-miri.yml@main
    with:
      miri-args: -p transport-afxdp --lib ring
      advisory: true
