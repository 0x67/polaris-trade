name: docs

# rustdoc of the whole workspace on GitHub Pages, rebuilt on each release tag.
# Run by hand, it publishes the chosen ref instead.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# one deployment at a time; a newer tag waits instead of cancelling the older one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # rust-toolchain.toml pins the compiler
      - name: cargo doc
        run: |
          rustup toolchain install
          rustc --version
          cargo doc --workspace --no-deps --locked
          printf '<meta http-equiv="refresh" content="0; url=datafeed/index.html">\n' > target/doc/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
